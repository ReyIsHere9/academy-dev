<!DOCTYPE html>
<!-- ============================================================
     MODULE 2: COURSES PAGE  (academy-dev — generic test version)
     ------------------------------------------------------------
     WHAT THIS PAGE IS:
     A cinematic showcase of all course levels (A1 to C2).
     Arrows flip between level banners (smooth slide),
     and the section below shows the chosen level's content:
     4 courses = the four language skills (Speaking, Writing,
     Reading, Listening).

     HOW THE PAGE WORKS:
     This HTML file holds only the EMPTY STRUCTURE (the "slots").
     The content comes from two scripts loaded at the bottom:
       1. js/levels-data.js  -> the DATA (all levels/skills)
       2. js/carousel.js     -> the BEHAVIOUR (fills + animates)
     That split = "data driven" pages. New course content = edit
     the data file only, never this page.
     ============================================================ -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses | The English Academy</title>

    <!-- Fancy display font for the big banner titles.
         LESSON: @import inside <link> tags loads fonts from
         Google's servers. The fallback (Georgia/serif) in CSS
         keeps titles pretty even offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <!-- Theme engine: must run in <head> so the correct theme is
         set before the page paints (no flash of wrong colors). -->
    <script src="js/theme.js"></script>
</head>

<body>

    <!-- ================= HEADER (same on every page) ================= -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="./" class="logo">The English Academy</a>
            <nav class="main-nav">
                <a href="./">Home</a>
                <a href="courses.html" class="active">Courses</a>

                <!-- PRICING DROPDOWN (rendered by js/pricing.js) -->
                <div class="dd" id="dd">
                    <button type="button" class="dd-btn" id="dd-trigger"
                            aria-haspopup="true" aria-expanded="false">
                        Pricing <span class="dd-caret">&#9662;</span>
                    </button>
                    <div class="dd-panel" id="dd-panel">
                        <div class="dd-tiers" id="dd-tiers"></div>
                        <a class="dd-compare" href="pricing.html#compare">Compare every feature &rarr;</a>
                    </div>
                </div>

                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

            <!-- THEME TOGGLE (sun/moon). js/theme.js remembers the
                 choice. CSS shows only the relevant icon. -->
            <button type="button" id="theme-toggle" class="theme-toggle"
                    aria-label="Switch to dark mode" aria-pressed="false">
                <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

        </div>
    </header>

    <!-- ================= LEVEL SHOWCASE =================
         THE SLOTS (everything the JS needs is here):
         .showcase-track  -> empty strip; slides get injected
         .showcase-counter-> "1 / 6" text (JS fills it)
         two .arrow buttons -> prev / next
         The fades (.edge-fade) are pure CSS, always on top. -->
    <section class="section showcase-section">
        <div class="container">

            <div class="showcase-wrapper">

                <div class="showcase-viewport">
                    <!-- JS slides live inside this strip -->
                    <div class="showcase-track"></div>

                    <!-- semi-transparent fades over the edges -->
                    <div class="edge-fade edge-left"></div>
                    <div class="edge-fade edge-right"></div>
                    <div class="edge-fade edge-bottom"></div>

                    <!-- counter: bottom-right -->
                    <div class="showcase-counter"></div>
                </div>

                <!-- arrows (‹ › are unicode characters) -->
                <button class="arrow arrow-prev" aria-label="Previous level">&#8249;</button>
                <button class="arrow arrow-next" aria-label="Next level">&#8250;</button>

            </div>
        </div>
    </section>

    <!-- ================= LEVEL DETAILS =================
         This whole section is a SLOT too — JS rebuilds its
         content on every flip (see #level-details in JS).
         It starts empty on purpose: no data, no content. -->
    <section class="section">
        <div class="container">
            <h2 class="section-title">Course Details</h2>
            <div id="level-details"></div>
        </div>
    </section>

    <!-- ================= CTA ================= -->
    <section class="section section-alt cta-band">
        <div class="container">
            <h2>Not sure which level fits you?</h2>
            <p>Contact us — we'll help you find your starting point.</p>
            <a href="contact.html" class="btn btn-primary">Talk to Us</a>
        </div>
    </section>

    <!-- ================= FOOTER (same on every page) ================= -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="logo">The English Academy</p>
            <p>&copy; 2026 The English Academy. All rights reserved.</p>
            <nav class="footer-nav">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </footer>

    <!-- ================= SCRIPTS =================
         ORDER MATTERS: levels-data.js first (it DEFINES the
         data), carousel.js second (it USES the data). -->
    <script src="js/levels-data.js"></script>
    <script src="js/carousel.js"></script>
    <!-- pricing scripts power the header Pricing dropdown -->
    <script src="js/pricing-data.js"></script>
    <script src="js/pricing.js"></script>

</body>
</html>
