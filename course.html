<!DOCTYPE html>
<!-- ============================================================
     MODULE 3: COURSE DETAIL PAGE  (academy-dev — generic version)
     ------------------------------------------------------------
     WHAT THIS PAGE IS:
     The detail page for ONE course. It is NOT a page per
     course — it's ONE empty template that answers the URL:

        course.html?level=A2&skill=Writing

     ...and paints the matching course. 24 possible courses
     (6 levels x 4 skills), ONE html file. That's the power
     of data-driven pages: the "page" is really just a lens.

     The whole visible page is a single slot (#course-root)
     filled by js/course.js. This file only carries the
     header, footer and the scripts (order matters again:
     data first, logic second).
     ============================================================ -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course | The English Academy</title>

    <!-- same display font as the courses page (titles) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

    <!-- Theme engine: must run in <head> so the correct theme is
         set before the page paints (no flash of wrong colors). -->
    <script src="js/theme.js"></script>
</head>

<body>

    <!-- ================= HEADER (same on every page) =================
         Courses stays highlighted: this page IS a course page,
         but the menu only knows top-level pages. -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="./" class="logo">The English Academy</a>
            <nav class="main-nav">
                <a href="./">Home</a>
                <a href="courses.html" class="active">Courses</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

            <!-- THEME TOGGLE (sun/moon). js/theme.js remembers the
                 choice. CSS shows only the relevant icon. -->
            <button type="button" id="theme-toggle" class="theme-toggle"
                    aria-label="Switch to dark mode" aria-pressed="false">
                <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

        </div>
    </header>

    <!-- ================= THE SLOT =================
         js/course.js paints the whole course page here:
         colored banner, main content, sidebar — all of it.
         If the URL has no valid course, it paints a
         friendly "not found" card instead. -->
    <div id="course-root"></div>

    <!-- ================= FOOTER (same on every page) ================= -->
    <footer class="site-footer">
        <div class="container footer-inner">
            <p class="logo">The English Academy</p>
            <p>&copy; 2026 The English Academy. All rights reserved.</p>
            <nav class="footer-nav">
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </footer>

    <!-- ================= SCRIPTS ================= -->
    <script src="js/levels-data.js"></script>
    <script src="js/course.js"></script>

</body>
</html>
