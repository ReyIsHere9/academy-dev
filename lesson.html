<!DOCTYPE html>
<!-- ============================================================
     MODULE 7 — LESSON PLAYER (lesson.html)
     ------------------------------------------------------------
     ONE page plays EVERY lesson. The URL asks the question:
        lesson.html?level=B1&skill=Speaking&unit=2

     WHAT'S HERE:
       1. The player column — video slot, objectives, vocabulary,
          lesson sections (text / tip / practice) and a quiz
          with instant feedback.
       2. The sidebar — every unit of the course with completion
          checkmarks, course progress, prev/next navigation.
       3. "Mark lesson complete" — saves to the demo store and
          updates the student's course progress on their dashboard.

     TWO KINDS OF LESSON (see js/lessons-data.js):
       AUTHORED — hand-written showcase lessons.
       OUTLINE  — units without an authored lesson still open a
                  real page built from the catalog: goals, grammar
                  focus and a concrete practice task.

     ⚠️ The video slot is honest: recordings arrive with the
     backend phase. The lesson text, quiz and progress tracking
     are all REAL front-end logic.
     ============================================================ -->
