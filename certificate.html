<!DOCTYPE html>
<!-- ============================================================
     CERTIFICATE (certificate.html?level=B1&skill=Speaking)
     ------------------------------------------------------------
     Issued when a student completes ALL units of a course in the
     lesson player. The certificate is rendered from real data:
     the student's name, the course, the units completed and a
     stable serial number. First view stores the issue date in
     the demo store so the date never moves.

     Print styling (see styles.css @media print) strips the site
     chrome — Ctrl+P gives a clean certificate sheet.
     ============================================================ -->
